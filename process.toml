# ── bindings: an observed ACT -> a STORE and a VALUE. BY EFFECT. No `transition` key exists. ─

[[port.binding]]
id = "board.write.gh-cli"
vendor = "github"
observed_via = "anthropic-claude-code:PreToolUse"
tool = "Bash"
precision = "exact"
does_not_cover = ["argv assembled at runtime inside a script the hook never sees",
                  "a write issued by a process spawned before the hook fires"]
probe = "gh.project.surface"
verified_on = "2026-08-08"
recheck_days = 30

  [port.binding.match]
  kind = "argv"
  program = "gh"
  subcommands = ["project", "item-edit"]

  [[port.binding.writes]]
  store = "board.status"
  write_path = "gh-cli"
  selects_when = { kind = "flag-equals", flag = "--field-id", source = "board_plumbing.status_field_id" }
  value = { kind = "option-id", flag = "--single-select-option-id", map = "board_plumbing.status_opt" }

  [[port.binding.writes]]
  store = "board.reason"
  write_path = "gh-cli"
  selects_when = { kind = "flag-equals", flag = "--field-id", source = "board_plumbing.reason_field_id" }
  value = { kind = "option-id", flag = "--single-select-option-id", map = "board_plumbing.reason_opt", clear_flag = "--clear", clear_to = "" }

[[port.binding]]
id = "board.write.funnel"
vendor = "github"
observed_via = "anthropic-claude-code:PreToolUse"
tool = "Bash"
precision = "exact"                     # set-field's argv carries the option NAME verbatim
does_not_cover = ["a caller importing board_plumbing as a module (no argv for the hook to see)",
                  "an invocation through `python` rather than `python3`"]
probe = "none"
verified_on = "2026-08-08"
recheck_days = 90

  # This is COVERAGE of the funnel door, not a wall against it: the rejected slice matched this
  # same spelling to DENY the one lawful, self-checking path while every bypass stayed open. Here
  # the funnel act resolves to the SAME transitions as the raw `gh project item-edit` spelling and
  # is judged by the SAME guards — the conformance vectors pin that equivalence.
  [port.binding.match]
  kind = "argv"
  program = "python3"
  subcommands_include = ["set-field"]
  subcommand_contains = "board_plumbing.py"

  [[port.binding.writes]]
  store = "board.status"
  write_path = "funnel"
  selects_when = { kind = "flag-present", flags = ["--status"] }
  value = { kind = "flag-literal", flag = "--status" }

  [[port.binding.writes]]
  store = "board.reason"
  write_path = "funnel"
  selects_when = { kind = "flag-present", flags = ["--reason", "--clear-reason"] }
  value = { kind = "flag-literal", flag = "--reason", clear_flag = "--clear-reason", clear_to = "" }

