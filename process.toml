probe = "none"
verified_on = "2026-08-08"
recheck_days = 90

  [port.binding.match]
  kind = "path-write"
  path_suffix = ".yr/factory.toml"
  content_mentions = "auto_merge"

  [[port.binding.writes]]
  store = "manifest.auto_merge"
  write_path = "fs"
  value = { kind = "toml-key" }

[[port.binding]]
