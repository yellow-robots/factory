# records.toml — the record registry: one machine-readable home for every machine-parsed trail grammar
# (it-30 slice 1, epic #415; governing design: product-spec 01-attended-lane-runner, ruling (g)).
#
# One row per grammar a tool parses off a shared surface. A record absent from this registry is
# unsanctioned (the canon states that authority; this file is the home the statement points at).
# Rows are deliberately flat and dumb: name, marker/literal, emitter, readers, surfaces, mode, notes.
# The tree is the territory — every row cites its emitter and reader sites; the agreement tests in
# tests/test_records.py pin the inline literals that predate this file to their rows.
#
# Grammar modes (the closed vocabulary; tools/textutil.py holds the two shared anchoring modes):
#   prefix       — the RAW line begins with the marker at column 0 (textutil MARKER_PREFIX).
#   sentinel     — the line, stripped, IS exactly the literal (textutil MARKER_SENTINEL).
#   strict-line  — whole-line equality after stripping only trailing whitespace, stricter than
#                  prefix; fields ride the same comment on their own lines.
#   verdict-line — column-0 "VERDICT:" lines; the gate judges the LAST one, exactly "VERDICT: APPROVE".
#   stage-escape — the log's LAST non-empty line begins "STAGE-BLOCKED: " with a non-empty reason.
#   json-schema  — a versioned JSON object whose "schema" key names the row.
#
# Surfaces: issue-trail · issue-body · pr-trail · run-dir · stage-log · ledger · bench · vault-doc
# · release (the GitHub Release object riding a skill/vX.Y.Z tag — it-31 slice 7, ruling 6).
# Exclusion rule: unversioned per-run artifacts the runner both writes and reads inside one run dir
# (review-bundle.json, gate-durations.json, usage-<stage>.json) are run-internal files, not
# shared-surface trail grammars — excluded by rule; a versioned schema for any of them earns a row.
# vault-doc carries the design-side records (the crossing ruling of 2026-08-07: typed lines in the
# docs themselves, no new surface). Frontmatter KEYS that tools parse (`crossed_to`, `superseded_by`,
# `status`) are the documentation model's own declared vocabulary, governed there and excluded here by
# rule — this registry covers record GRAMMARS on shared surfaces, not frontmatter schemas.

[marker]
# The single named marker constant (owner-ratified 2026-08-06, it-30 callout (g)): one marker, one
# umbrella. A future marker change is one edit here plus a migration round, never a hunt.
yr = "YR-"

