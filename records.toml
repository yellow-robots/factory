[[record]]
name = "YR-MERGE"
marker = "YR-MERGE:"
mode = "prefix"
fields = ["commit"]
emitted_by = ["machinery"]   # typed actor classes (rule S's column)
emitter = "tools/merge_shadow.py (the merge evaluator's durable decision record: MERGED / BLOCKED)"
readers = ["tools/merge_shadow.py (re-evaluation reads the prior record; the shadow-complete window locates records via RECORD_MARKER_TOKENS :61 / _last_merge_record :252)", "humans on the PR trail"]
surfaces = ["pr-trail"]
notes = "The armed output gate's record; never overturned by a re-evaluation (issue #70)."

