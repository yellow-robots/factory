# How the factory builds THIS repo (read by tools/dev-runner.sh). See AGENTS.md > Conventions.
# Precedence when the runner resolves these: explicit env var > this manifest > built-in default.
check_cmd = "pytest tests/ -q"
model = "sonnet"
base_ref = "origin/main"

# Held-out test globs for tools/bench_corpus.py (issue #162): which PR files count as this repo's
# held-out test set when a merged task/* PR is extracted into the replayable bench corpus.
bench_test_globs = ["tests/**"]

# Armed 2026-07-07, shadow window complete (5/5 clean unreverted merges): the factory itself
# squash-merges a green, fresh, approved, rank-holding PR. The merge decision re-reads this key
# from origin/main's tip — un-arm by removing it, or throw the host sentinel
# ($DEV_RUNNER_HOME/merge-killswitch) to refuse all merges without a git round-trip.
auto_merge = true

# The lint tier (issue #213): blocking, autofix-first repair after check_cmd passes. lint_cmd's rule
# set is this repo's own ruff.toml (issue #215) — chosen green-at-adoption, tightened later by
# ordinary convention edits, never by fixing code to fit a stricter config.
lint_cmd = "ruff check tools/ tests/"
lint_fix_cmd = "ruff check --fix tools/ tests/"

# The lens tier (issue #216): advisory, never gating (issue #214's seam). qa/lens.py is the
# factory's own repo-owned lens content — consumer rules living in qa/, legibly separate from the
# platform machinery in tools/ (the copyable exemplar other repos' own qa/ dirs follow).
lens_cmd = "python3 qa/lens.py"

# Per-repo stage conduct (issue #312): this repo's own command numbers, delivered to every build
# stage on the task-prompt/stdin channel. Durations measured from the check gate's own
# gate-durations records, runs 315-1979656 / 309-2395443 (2026-07-29): full suite 761–812 s
# (12:40–13:32). Re-measure when gate timings drift materially — the undeclared check_timeout
# default (1200 s) is the ceiling drift eats into; numbers rot (PR #328's review record is the
# provenance for both the numbers and the wording).
stage_conduct = [
  "The full suite `pytest tests/ -q` runs 761-812 s (~13 min) on this host - the worst offender against the 120 s background auto-conversion seam, though not the only one (next line). The deterministic check gate owns the full suite; never run it inline in a stage - even the Bash tool's timeout ceiling (600000 ms) cannot cover it.",
  "The inner loop is a scoped run - `pytest tests/test_<area>.py -q` - but the big runner suites (tests/test_dev_runner.py and kin) can exceed 120 s on their own: pass the Bash tool's own `timeout` input field (e.g. timeout: 600000), never a shell `timeout N` prefix - the prefix does NOT move the 120 s conversion threshold (runs 309-2395443 and 327-3290247 both fell exactly there). If a call converts anyway, the conversion message names an output FILE: poll that file with short foreground reads until the suite's own summary line appears, and do not end the turn before it does - a one-shot stage is never resumed when a background task completes, and ending the turn kills the task silently.",
  "There is no `.venv` in the cut build worktree: AGENTS.md's `.venv/bin/python` convention belongs to the attended workspace checkout, not here - use `python3 -m pytest` or bare `pytest` (what the check gate itself runs); a `.venv/bin/python` attempt dead-ends (runs 315/309 burned three turns on it).",
]
