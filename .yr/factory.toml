# How the factory builds THIS repo (read by tools/dev-runner.sh). See AGENTS.md > Conventions.
# Precedence when the runner resolves these: explicit env var > this manifest > built-in default.
check_cmd = "pytest tests/ -q"
model = "sonnet"
base_ref = "origin/main"

# Held-out test globs for tools/bench_corpus.py (issue #162): which PR files count as this repo's
# held-out test set when a merged task/* PR is extracted into the replayable bench corpus.
bench_test_globs = ["tests/**"]

# Armed 2026-07-07, shadow window complete (5/5 clean unreverted merges): the factory itself
# squash-merges a green, fresh, approved, rank-holding PR. The merge decision re-reads this key
# from origin/main's tip — un-arm by removing it, or throw the host sentinel
# ($DEV_RUNNER_HOME/merge-killswitch) to refuse all merges without a git round-trip.
auto_merge = true

# The lint tier (issue #213): blocking, autofix-first repair after check_cmd passes. lint_cmd's rule
# set is this repo's own ruff.toml (issue #215) — chosen green-at-adoption, tightened later by
# ordinary convention edits, never by fixing code to fit a stricter config.
lint_cmd = "ruff check tools/ tests/"
lint_fix_cmd = "ruff check --fix tools/ tests/"

# The lens tier (issue #216): advisory, never gating (issue #214's seam). qa/lens.py is the
# factory's own repo-owned lens content — consumer rules living in qa/, legibly separate from the
# platform machinery in tools/ (the copyable exemplar other repos' own qa/ dirs follow).
lens_cmd = "python3 qa/lens.py"

# Per-repo stage conduct (issue #312): this repo's own command numbers, delivered to every build
# stage on the task-prompt/stdin channel. Durations measured from gate-durations records, runs
# 315-1979656 / 309-2395443 (2026-07-29): full suite 761–812 s on the build host. Re-measure when
# gate timings drift materially — numbers rot (the adoption PR's review record is the provenance).
stage_conduct = [
  "The full suite `pytest tests/ -q` runs 761-812 s (~13-14 min) on this host - THE command that trips the 120 s background auto-conversion seam. The deterministic check gate owns the full suite; never run it inline in a stage.",
  "The inner loop is a scoped run - `pytest tests/test_<area>.py -q` - but the big runner suites (tests/test_dev_runner.py and kin) can exceed 120 s on their own: pass the Bash TOOL-level timeout parameter (up to 600000 ms) on any pytest invocation. A shell `timeout N` command prefix does NOT move the 120 s conversion threshold (run 309-2395443's repair fell exactly there: `timeout 900` plus a scoped file still converted).",
  "If a command converts to a background task anyway, bring EVERY converted task id to an observed terminal state - a status read showing it exited, or a kill by PID (never a pattern kill) - before ending the turn: a one-shot stage is never resumed when a background task completes.",
  "Never read an exit code through a pipe (`cmd | tail` reports tail's status) - capture RC=$? before piping whenever the code gates a next step.",
]
