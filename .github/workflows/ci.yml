name: ci
on:
  pull_request:

# One certification per PR head: cancel a superseded in-flight run when a new head is
# pushed. The group is namespaced by workflow and keyed by ref, so it only ever cancels
# this PR's own older run — never another PR's, another ref's, or another workflow's. A
# superseded head's verdict has no reader (it-25).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      # Parallel across the runner's cores (-n auto). The suite is process-isolated by
      # construction (per-test tmp_path homes, ephemeral ports, no shared mutable
      # fixtures), so a parallel run returns the same verdict as a serial one. Scoped to
      # tests/ so xdist never collects a stray worktree copy.
      - name: Tests
        run: pytest tests/ -n auto -q
      # The lint backstop (it-27 § 7, issue #363). The runner's lint tier cannot cover every
      # commit that reaches main: an attended commit never meets the runner at all, and a local
      # hook is per-clone and bypassable. So server CI runs the SAME lint the runner runs —
      # ordered after the tests exactly as the runner orders lint_cmd after check_cmd, one
      # contract on two hosts.
      #
      # The command is READ from the manifest, never restated here: a second declaration is the
      # drift twin the seam contract forbids. This is the workflow's ONE manifest read — a
      # declared cardinality rule caps it at one (issue #365), so a second reader is a gate
      # failure, not a review catch. Absent lint_cmd the read yields empty and the step is a
      # no-op, preserving the tier's capability-defaults-off shape for any repo copying this.
      # `bash -c` runs the string verbatim, the same opaque-command shape as run_lint().
      - name: Lint
        run: |
          LINT_CMD="$(python3 -c 'import tomllib,pathlib;p=pathlib.Path(".yr/factory.toml");print(tomllib.loads(p.read_text()).get("lint_cmd","") if p.exists() else "")')"
          if [ -z "$LINT_CMD" ]; then
            echo "no lint_cmd declared in .yr/factory.toml — lint backstop is a no-op"
            exit 0
          fi
          echo "lint_cmd (read from .yr/factory.toml): $LINT_CMD"
          bash -c "$LINT_CMD"
