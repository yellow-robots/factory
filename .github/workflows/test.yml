# Construction-phase guard: every PR runs the same two targets a session runs.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: `git describe` is the version of record
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make check
      - run: make test
